# ci.yml
# Purpose: builds QuickPane and runs the unit tests when started from the Run workflow button on the Actions tab.
# Reason: checks a commit's build and tests on a clean Windows runner, on request.
# Origin: from jprisant's fork, commits 310a539, ed9964b, 452a8ca and fdc5607 (MIT, see NOTICE.md).
# Doc: docs/notes/.github/workflows/ci.yml.md
name: ci
on:
  workflow_dispatch:
# Token permission: read access to the code, for checkout.
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Build the app
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release
      - name: Run the tests
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release -NoBuild
